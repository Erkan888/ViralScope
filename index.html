<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator - ViralScope</title>
    
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8491546534610225" crossorigin="anonymous"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    
    <style>
        :root {
            --primary: #0066ff;
            --primary-hover: #0052cc;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            color: var(--text-main);
            font-weight: 800;
        }

        p.subtitle {
            margin: 0 0 25px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 102, 255, 0.3);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            margin-top: 12px;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            box-shadow: none;
        }

        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        #qrcode canvas {
            padding: 15px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-badge">ViralScope Tools</div>
    <h1>QR Code Generator</h1>
    <p class="subtitle">Create a fast and high-quality QR code in seconds</p>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Enter link here (e.g., https://...)" value="https://viralscope.site" oninput="generateQR()" />
    </div>
    
    <button class="btn" onclick="generateQR()">Generate QR Code</button>

    <div id="qrcode"></div>

    <button class="btn btn-secondary" id="downloadBtn" onclick="downloadQR()" style="display:none;">Download as Image</button>
</div>

<script>
    function generateQR() {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        
        const url = document.getElementById('urlInput').value.trim();
        const downloadBtn = document.getElementById('downloadBtn');

        if(!url) {
            downloadBtn.style.display = 'none';
            return;
        }

        $(qrContainer).qrcode({
            render: 'canvas',
            width: 180,
            height: 180,
            text: url,
            background: "#ffffff",
            foreground: "#0f172a"
        });

        downloadBtn.style.display = 'block';
    }

    function downloadQR() {
        const canvas = document.querySelector('#qrcode canvas');
        if (!canvas) return;

        const image = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = image;
        a.download = "qrcode-viralscope.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    generateQR();
</script>

</body>
</html>
