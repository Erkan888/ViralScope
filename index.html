<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Ключови думи и мета описания за Google -->
    <title>Безплатен QR код генератор онлайн - Създай QR код за секунди | ViralScope</title>
    <meta name="description" content="Създай лесно и бързо безплатен QR код за уебсайт, социални мрежи или текст с нашия онлайн генератор. Генерирай и изтегли QR код за секунди!">
    <meta name="keywords" content="qr код генератор, безплатен qr код, създай qr код онлайн, qr code generator">

    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8491546534610225" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #0066cc;
        }
        .qr-box {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
        .qr-box img {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            background: #fff;
            max-width: 200px;
            height: auto;
        }
        .download-btn {
            display: inline-block;
            background-color: #0066cc;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s;
            width: 100%;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Безплатен QR код генератор</h1>
    <p class="subtitle">Въведи линк или текст, за да генерираш QR код моментално</p>

    <input type="text" id="textInput" value="https://viralscope.site" placeholder="Напиши линк тук..." oninput="generateQR()">

    <div class="qr-box">
        <img id="qrImage" src="" alt="QR Code">
    </div>

    <a id="downloadBtn" class="download-btn" href="#" download="qrcode.png">Изтегли като изображение</a>
</div>

<script>
    function generateQR() {
        const text = document.getElementById('textInput').value.trim();
        const qrImage = document.getElementById('qrImage');
        const downloadBtn = document.getElementById('downloadBtn');

        if (text === "") {
            qrImage.src = "";
            return;
        }

        // Използваме надеждно API за генериране на QR код
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(text)}`;
        
        qrImage.src = qrApiUrl;
        downloadBtn.href = qrApiUrl;
    }

    // Генериране при зареждане на страницата
    window.onload = generateQR;
</script>

</body>
</html>
